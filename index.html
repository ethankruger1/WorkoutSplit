<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Lift Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --surface:#171C23; --surface-2:#1F2630; --line:#2A323D;
    --text:#EDF1F5; --muted:#8A95A3;
    --accent:#FF6A2B; --accent-press:#FF8551;
    --rest:#25D0B8; --done:#3DDC84; --danger:#FF4438;
    --r:14px; --pad:16px;
    --num:"Saira Condensed", ui-sans-serif, system-ui, sans-serif;
    --body:"Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--text); font-family:var(--body); -webkit-font-smoothing:antialiased}
  body{max-width:560px; margin:0 auto; min-height:100dvh; padding:0 14px calc(40px + env(safe-area-inset-bottom)); padding-top:env(safe-area-inset-top)}
  button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}

  /* ---------- HOME ---------- */
  .home{padding-top:48px}
  .brand{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
  .brand h1{font-family:var(--num); font-weight:700; font-size:42px; letter-spacing:.5px; text-transform:uppercase; line-height:.92}
  .brand .dot{width:11px; height:11px; border-radius:50%; background:var(--accent); transform:translateY(-4px)}
  .tagline{color:var(--muted); font-size:14px; margin-bottom:30px; font-weight:500}
  .pick{font-family:var(--num); text-transform:uppercase; letter-spacing:2px; font-size:13px; color:var(--muted); margin:0 4px 12px; font-weight:600}
  .days{display:grid; gap:12px}
  .day-card{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:20px 18px; text-align:left; transition:transform .12s ease, border-color .12s ease, background .12s ease}
  .day-card:active{transform:scale(.985); background:var(--surface-2)}
  .day-card .meta{display:flex; flex-direction:column; gap:4px}
  .day-card .nm{font-family:var(--num); font-weight:700; font-size:26px; text-transform:uppercase; letter-spacing:.5px}
  .day-card .sub{font-size:13px; color:var(--muted); font-weight:500}
  .day-card .arrow{font-family:var(--num); font-size:30px; color:var(--accent); font-weight:700}
  .day-card .nm .tick{color:var(--done); font-size:18px; margin-left:8px}

  /* ---------- CONSOLE (day view) ---------- */
  .view-day{display:none}
  body.in-day .home{display:none}
  body.in-day .view-day{display:block}

  .console{position:sticky; top:0; z-index:20; background:rgba(14,17,22,.92); backdrop-filter:blur(10px);
    margin:0 -14px; padding:8px 14px 12px; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 0 10px}
  .back{display:flex; align-items:center; gap:6px; color:var(--muted); font-weight:600; font-size:15px; padding:6px 4px}
  .back:active{color:var(--text)}
  .topbar .title{font-family:var(--num); font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:1px}
  .topbar .setcount{font-family:var(--num); font-size:18px; color:var(--muted); font-weight:600}
  .topbar .setcount b{color:var(--done)}

  .scoreboard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
  .sb-row{display:flex; align-items:center; justify-content:space-between; gap:14px}
  .clock{font-family:var(--num); font-weight:700; font-variant-numeric:tabular-nums; font-size:60px; line-height:.86; letter-spacing:1px}
  .clock.warn{color:var(--accent)}
  .clock.over{color:var(--danger)}
  .clock .lbl{display:block; font-size:11px; letter-spacing:2.5px; color:var(--muted); font-weight:600; margin-bottom:4px}
  .ctrl{display:flex; gap:8px}
  .btn{font-family:var(--num); text-transform:uppercase; letter-spacing:1px; font-weight:600; font-size:16px;
    padding:12px 16px; border-radius:11px; background:var(--surface-2); border:1px solid var(--line); min-width:78px; transition:transform .1s ease}
  .btn:active{transform:scale(.94)}
  .btn.primary{background:var(--accent); color:#1A0E06; border-color:var(--accent)}
  .btn.ghost{color:var(--muted)}
  .bar{height:5px; background:var(--surface-2); border-radius:3px; margin-top:13px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0%; background:var(--accent); border-radius:3px; transition:width 1s linear}
  .bar.over > i{background:var(--danger)}

  /* rest strip */
  .rest{display:flex; align-items:center; gap:10px; margin-top:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:11px 13px}
  .rest .rclock{font-family:var(--num); font-weight:700; font-variant-numeric:tabular-nums; font-size:34px; line-height:1;
    color:var(--rest); min-width:74px}
  .rest.idle .rclock{color:var(--muted)}
  .rlbl{font-size:10px; letter-spacing:2px; color:var(--muted); font-weight:600; display:block}
  .presets{display:flex; gap:6px; margin-left:auto}
  .preset{font-family:var(--num); font-weight:600; font-size:16px; padding:9px 11px; border-radius:9px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted)}
  .preset.sel{color:var(--rest); border-color:var(--rest)}
  .preset:active{transform:scale(.94)}
  .skip{font-family:var(--num); font-weight:600; font-size:15px; color:var(--rest); padding:9px 10px; text-transform:uppercase; letter-spacing:1px}

  /* ---------- EXERCISE LIST ---------- */
  .list{margin-top:16px; display:grid; gap:10px}
  .ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .ex.done{border-color:rgba(61,220,132,.4)}
  .ex-head{width:100%; display:flex; align-items:center; gap:12px; padding:16px; text-align:left}
  .ex-head .idx{font-family:var(--num); font-weight:700; font-size:16px; color:var(--muted); min-width:22px}
  .ex.done .ex-head .idx{color:var(--done)}
  .ex-head .name{font-family:var(--num); font-weight:600; font-size:21px; letter-spacing:.3px; flex:1; text-transform:uppercase}
  .ex-head .opt{font-family:var(--body); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); border-radius:20px; padding:2px 7px; font-weight:600; margin-left:6px}
  .ex-head .count{font-family:var(--num); font-weight:700; font-size:19px; color:var(--muted); font-variant-numeric:tabular-nums}
  .ex.done .ex-head .count{color:var(--done)}
  .ex-head .chev{color:var(--muted); transition:transform .2s ease; font-size:15px; width:14px; text-align:center}
  .ex.open .ex-head .chev{transform:rotate(90deg)}
  .ex-body{display:none; padding:0 16px 16px; gap:9px; grid-template-columns:repeat(3,1fr)}
  .ex.open .ex-body{display:grid}
  .set{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:15px 6px;
    border-radius:11px; background:var(--surface-2); border:1px solid var(--line); font-family:var(--num); font-weight:600;
    transition:transform .1s ease}
  .set:active{transform:scale(.95)}
  .set .s-lbl{font-size:11px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase}
  .set .s-mark{font-size:22px; line-height:1; color:var(--muted)}
  .set.done{background:rgba(61,220,132,.13); border-color:var(--done)}
  .set.done .s-mark{color:var(--done)}
  .set.done .s-lbl{color:var(--done)}

  .clear{width:100%; margin-top:18px; padding:16px; border-radius:var(--r); background:transparent; border:1px solid var(--line);
    color:var(--muted); font-family:var(--num); font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:1.5px}
  .clear:active{border-color:var(--danger); color:var(--danger)}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:22px; opacity:.6}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

  <!-- HOME -->
  <section class="home">
    <div class="brand"><h1>Lift Console</h1><span class="dot"></span></div>
    <p class="tagline">Upper / Lower split · 60-minute cap · 90s rest</p>
    <p class="pick">Pick today's session</p>
    <div class="days" id="days"></div>
    <p class="foot">Progress saves on this device until you clear a day.</p>
  </section>

  <!-- DAY VIEW -->
  <section class="view-day">
    <div class="console">
      <div class="topbar">
        <button class="back" id="back">‹ All days</button>
        <span class="title" id="dayTitle"></span>
        <span class="setcount"><b id="setsDone">0</b>/<span id="setsTotal">0</span></span>
      </div>

      <div class="scoreboard">
        <div class="sb-row">
          <div>
            <span class="lbl">SESSION</span>
            <span class="clock" id="clock">60:00</span>
          </div>
          <div class="ctrl">
            <button class="btn primary" id="startBtn">Start</button>
            <button class="btn ghost" id="resetBtn">Reset</button>
          </div>
        </div>
        <div class="bar" id="bar"><i></i></div>
      </div>

      <div class="rest idle" id="restWrap">
        <div>
          <span class="rlbl">REST</span>
          <span class="rclock" id="restClock">0:90</span>
        </div>
        <div class="presets" id="presets">
          <button class="preset" data-sec="60">60</button>
          <button class="preset sel" data-sec="90">90</button>
          <button class="preset" data-sec="120">120</button>
        </div>
        <button class="skip" id="skipRest">Skip</button>
      </div>
    </div>

    <div class="list" id="list"></div>
    <button class="clear" id="clearBtn">Clear this day</button>
    <p class="foot">Tap an exercise to open its sets · checking a set starts your rest</p>
  </section>

<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */
  var WORKOUTS = {
    upper1: { name:"Upper 1", sub:"Push · Pull · Arms", ex:[
      {n:"Shoulder Press", s:3}, {n:"Lower Lat Row", s:3}, {n:"Machine Row", s:2},
      {n:"Pec Dec", s:3}, {n:"Rear Delt Fly", s:3}, {n:"Skull Crushers", s:3},
      {n:"Overhead Extension", s:3}, {n:"Bicep Curl", s:3}, {n:"Preacher Curl", s:3},
      {n:"Ab Crunch", s:3, opt:true}
    ]},
    lower1: { name:"Lower 1", sub:"Posterior · Glutes", ex:[
      {n:"Smith Split Squat", s:3}, {n:"SLDL", s:3}, {n:"Hip Thrust", s:3},
      {n:"Hamstring Curl", s:3}, {n:"Standing Calf Raise", s:3}, {n:"Ab Crunch", s:3, opt:true}
    ]},
    upper2: { name:"Upper 2", sub:"Push · Pull · Arms", ex:[
      {n:"Flat Chest Press", s:3}, {n:"Incline Press", s:3}, {n:"Lat Pulldown", s:3},
      {n:"Machine Row", s:2}, {n:"Lat Raise", s:3}, {n:"Tricep Pushdown", s:3},
      {n:"Overhead Cable Ext", s:3}, {n:"Bicep Curl", s:3}, {n:"Machine Curl", s:3}
    ]},
    lower2: { name:"Lower 2", sub:"Quads · Accessories", ex:[
      {n:"Leg Press", s:3}, {n:"Leg Extension", s:3}, {n:"Seated Leg Curl", s:3},
      {n:"Abductors", s:3}, {n:"Adductors", s:3}, {n:"Calf Raises", s:3}
    ]}
  };
  var ORDER = ["upper1","lower1","upper2","lower2"];
  var SESSION = 60*60; // seconds

  /* ------------- PERSISTENCE (graceful) ------------- */
  var mem = {};
  function load(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return (k in mem)?mem[k]:d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }

  var progress = load("lc_progress", {});
  var restPreset = load("lc_rest", 90);

  function dayState(day){
    if(!progress[day]){
      progress[day] = WORKOUTS[day].ex.map(function(e){ return new Array(e.s).fill(false); });
    }
    return progress[day];
  }

  /* ---------------- TIMERS ---------------- */
  var sess = { id:null, remaining:SESSION, running:false };
  var rest = { id:null, remaining:restPreset, running:false };

  function fmt(sec){
    var neg = sec<0; sec=Math.abs(sec);
    var m=Math.floor(sec/60), s=sec%60;
    return (neg?"+":"")+m+":"+(s<10?"0":"")+s;
  }

  function tickSession(){
    sess.remaining--;
    renderSession();
    if(sess.remaining===0){ buzz(); }
  }

  function renderSession(){
    var c=document.getElementById("clock"), bar=document.getElementById("bar");
    c.textContent=fmt(sess.remaining);
    c.classList.toggle("over", sess.remaining<0);
    c.classList.toggle("warn", sess.remaining>=0 && sess.remaining<=300);
    var used=SESSION-sess.remaining;
    var pct=Math.min(100, Math.max(0,(used/SESSION)*100));
    bar.firstElementChild.style.width=pct+"%";
    bar.classList.toggle("over", sess.remaining<0);
  }

  function startSession(){
    if(sess.running){
      // pause
      clearInterval(sess.id);
      sess.id=null;
      sess.running=false;
      document.getElementById("startBtn").textContent="Resume";
      return;
    }
    sess.running=true;
    document.getElementById("startBtn").textContent="Pause";
    sess.id=setInterval(tickSession,1000);
  }

  function resetSession(){
    clearInterval(sess.id);
    sess.id=null;
    sess.running=false;
    sess.remaining=SESSION;
    document.getElementById("startBtn").textContent="Start";
    renderSession();
  }

  function renderRest(){
    var rc=document.getElementById("restClock");
    var wrap=document.getElementById("restWrap");
    rc.textContent=fmt(rest.remaining);
    wrap.classList.toggle("idle", !rest.running);
  }

  function startRest(){
    clearInterval(rest.id);
    rest.remaining=restPreset;
    rest.running=true;
    renderRest();
    rest.id=setInterval(function(){
      rest.remaining--;
      if(rest.remaining<=0){
        clearInterval(rest.id);
        rest.id=null;
        rest.running=false;
        rest.remaining=0;
        renderRest();
        buzz();
        rest.remaining=restPreset;
        setTimeout(renderRest,900);
        return;
      }
      renderRest();
    },1000);
  }

  function skipRest(){
    clearInterval(rest.id);
    rest.id=null;
    rest.running=false;
    rest.remaining=restPreset;
    renderRest();
  }

  function buzz(){
    if(navigator.vibrate){ try{ navigator.vibrate([220,90,220]); }catch(e){} }
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
      var ac=new Ctx(); var o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination); o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(.001,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.02);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);
      o.start(); o.stop(ac.currentTime+.5);
    }catch(e){}
  }

  /* ---------------- RENDER HOME ---------------- */
  function dayCounts(day){
    var st=dayState(day), done=0, total=0;
    st.forEach(function(arr){ arr.forEach(function(b){ total++; if(b)done++; }); });
    return {done:done,total:total};
  }

  function renderHome(){
    var wrap=document.getElementById("days"); wrap.innerHTML="";
    ORDER.forEach(function(day){
      var w=WORKOUTS[day], c=dayCounts(day);
      var complete = c.done===c.total && c.total>0;
      var b=document.createElement("button");
      b.className="day-card"; b.setAttribute("aria-label","Open "+w.name);
      b.innerHTML='<span class="meta"><span class="nm">'+w.name+(complete?'<span class="tick">✓</span>':'')+
        '</span><span class="sub">'+w.sub+' · '+c.done+'/'+c.total+' sets</span></span><span class="arrow">›</span>';
      b.addEventListener("click",function(){ openDay(day); });
      wrap.appendChild(b);
    });
  }

  /* ---------------- RENDER DAY ---------------- */
  var current=null;

  function setCounts(){
    var c=dayCounts(current);
    document.getElementById("setsDone").textContent=c.done;
    document.getElementById("setsTotal").textContent=c.total;
  }

  function renderList(){
    var list=document.getElementById("list"); list.innerHTML="";
    var st=dayState(current), defs=WORKOUTS[current].ex;
    defs.forEach(function(e,i){
      var arr=st[i], done=arr.filter(Boolean).length;
      var ex=document.createElement("div");
      ex.className="ex"+(done===e.s?" done":"");
      ex.dataset.i=i;

      var head=document.createElement("button");
      head.className="ex-head"; head.setAttribute("aria-expanded","false");
      head.innerHTML='<span class="idx">'+(i+1)+'</span>'+
        '<span class="name">'+e.n+(e.opt?'<span class="opt">optional</span>':'')+'</span>'+
        '<span class="count">'+done+'/'+e.s+'</span><span class="chev">›</span>';
      head.addEventListener("click",function(){
        var open=ex.classList.toggle("open");
        head.setAttribute("aria-expanded", open?"true":"false");
      });

      var body=document.createElement("div"); body.className="ex-body";
      for(var s=0;s<e.s;s++){
        (function(sIdx){
          var btn=document.createElement("button");
          btn.className="set"+(arr[sIdx]?" done":"");
          btn.innerHTML='<span class="s-lbl">Set '+(sIdx+1)+'</span><span class="s-mark">'+(arr[sIdx]?'✓':'○')+'</span>';
          btn.addEventListener("click",function(){
            arr[sIdx]=!arr[sIdx];
            save("lc_progress", progress);
            btn.classList.toggle("done", arr[sIdx]);
            btn.querySelector(".s-mark").textContent=arr[sIdx]?'✓':'○';
            var nDone=arr.filter(Boolean).length;
            head.querySelector(".count").textContent=nDone+'/'+e.s;
            ex.classList.toggle("done", nDone===e.s);
            head.querySelector(".idx").textContent=(i+1);
            setCounts();
            if(arr[sIdx]) startRest();
          });
          body.appendChild(btn);
        })(s);
      }

      ex.appendChild(head); ex.appendChild(body);
      list.appendChild(ex);
    });
  }

  function openDay(day){
    current=day;
    document.body.classList.add("in-day");
    document.getElementById("dayTitle").textContent=WORKOUTS[day].name;
    resetSession(); skipRest(); renderRest();
    renderList(); setCounts();
    window.scrollTo(0,0);
  }

  function goHome(){
    document.body.classList.remove("in-day");
    clearInterval(sess.id); sess.id=null; sess.running=false;
    clearInterval(rest.id); rest.id=null; rest.running=false;
    current=null; renderHome();
  }

  function clearDay(){
    if(!current) return;
    if(!confirm("Clear all sets for "+WORKOUTS[current].name+"?")) return;
    progress[current]=WORKOUTS[current].ex.map(function(e){ return new Array(e.s).fill(false); });
    save("lc_progress", progress);
    resetSession(); skipRest();
    renderList(); setCounts();
  }

  /* ---------------- WIRE UP ---------------- */
  document.getElementById("startBtn").addEventListener("click", startSession);
  document.getElementById("resetBtn").addEventListener("click", resetSession);
  document.getElementById("back").addEventListener("click", goHome);
  document.getElementById("clearBtn").addEventListener("click", clearDay);
  document.getElementById("skipRest").addEventListener("click", skipRest);
  document.getElementById("presets").addEventListener("click", function(ev){
    var b=ev.target.closest(".preset"); if(!b) return;
    restPreset=parseInt(b.dataset.sec,10); save("lc_rest", restPreset);
    document.querySelectorAll(".preset").forEach(function(p){ p.classList.toggle("sel", p===b); });
    if(!rest.running){ rest.remaining=restPreset; renderRest(); }
  });

  // init rest preset selection from saved value
  document.querySelectorAll(".preset").forEach(function(p){
    p.classList.toggle("sel", parseInt(p.dataset.sec,10)===restPreset);
  });
  rest.remaining=restPreset; renderRest();
  renderHome();
})();
</script>
</body>
</html>
