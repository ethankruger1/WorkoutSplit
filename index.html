<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070501">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFT">
<title>LIFT CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070501; --surface:#0F0C08; --surface-2:#171209; --line:#332810;
    --ph:#C8950F; --ph-dim:#6B4F08; --ph-bright:#EDB30A;
    --green:#2A6B1A; --green-b:#4DB33D;
    --red:#8B1A10; --red-b:#CC2515;
    --teal:#1A5A4A; --teal-b:#28A88A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg);color:var(--ph);
    font-family:'VT323','Courier New',monospace;
    -webkit-font-smoothing:none;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    max-width:560px;margin:0 auto;min-height:100dvh;
    padding:0 12px calc(44px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    position:relative;
  }
  @keyframes boot{0%{opacity:0}30%{opacity:.6}45%{opacity:.2}60%{opacity:.9}75%{opacity:.5}100%{opacity:1}}
  body{animation:boot .45s ease-out}
  /* CRT scanlines */
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:repeating-linear-gradient(
      0deg, transparent 0px, transparent 2px,
      rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px
    );
    pointer-events:none;z-index:9999;
  }
  button{font-family:'VT323','Courier New',monospace;color:inherit;border:none;background:none;cursor:pointer}
  :focus-visible{outline:1px solid var(--ph-bright)}

  /* ══ HOME ══ */
  .home{padding-top:30px}

  .brand{
    border:1px solid var(--ph-dim);padding:18px 16px 14px;
    margin-bottom:14px;background:var(--surface);
    text-align:center;position:relative;
  }
  .bc{position:absolute;width:10px;height:10px}
  .bc-tl{top:3px;left:3px;border-top:1px solid var(--ph);border-left:1px solid var(--ph)}
  .bc-tr{top:3px;right:3px;border-top:1px solid var(--ph);border-right:1px solid var(--ph)}
  .bc-bl{bottom:3px;left:3px;border-bottom:1px solid var(--ph);border-left:1px solid var(--ph)}
  .bc-br{bottom:3px;right:3px;border-bottom:1px solid var(--ph);border-right:1px solid var(--ph)}
  .brand-title{
    display:block;font-size:58px;line-height:.9;letter-spacing:6px;
    text-transform:uppercase;color:var(--ph-bright);
    text-shadow:0 0 14px var(--ph),0 0 28px rgba(237,179,10,.2);
  }
  .brand-ver{display:block;font-size:17px;letter-spacing:3px;color:var(--ph-dim);margin-top:4px}
  .brand-sub{display:block;font-size:17px;letter-spacing:2px;color:var(--ph-dim);margin-top:1px}

  /* cycle strip */
  .cycle{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);
    padding:8px 12px;margin-bottom:14px;
  }
  .cy-lbl{font-size:15px;letter-spacing:3px;color:var(--ph-dim)}
  .cy-segs{flex:1;display:flex;gap:3px}
  .cy-seg{flex:1;height:10px;background:var(--surface-2);border:1px solid var(--line)}
  .cy-seg.on{background:var(--green);border-color:var(--green-b)}
  .cy-txt{font-size:17px;color:var(--ph-dim);letter-spacing:1px}
  .cy-reset{font-size:15px;color:var(--ph-dim);border:1px solid var(--line);padding:3px 8px;letter-spacing:1px}
  .cy-reset:active{color:var(--red-b);border-color:var(--red-b)}

  .sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sec-lbl{font-size:18px;letter-spacing:3px;color:var(--ph-dim);text-transform:uppercase}
  .sec-lbl::before{content:'► '}
  .log-link{font-size:17px;color:var(--ph-dim);border:1px solid var(--line);padding:4px 10px;letter-spacing:2px}
  .log-link:active{color:var(--ph);border-color:var(--ph-dim)}

  .days{display:grid;gap:8px}
  .day-card{
    display:block;width:100%;background:var(--surface);
    border:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;
  }
  .day-card:active{border-color:var(--ph-dim);background:var(--surface-2)}
  .day-card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .day-num{font-size:20px;color:var(--ph-dim);min-width:28px;padding-top:4px;letter-spacing:1px}
  .day-info{flex:1}
  .day-name{display:block;font-size:27px;line-height:1;text-transform:uppercase;letter-spacing:2px}
  .day-sub{display:block;font-size:15px;color:var(--ph-dim);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
  .day-arr{font-size:26px;color:var(--ph-dim);padding-top:2px}
  .day-card.complete .day-name{color:var(--green-b)}
  .day-card.complete .day-arr{color:var(--green-b)}
  .day-prog-row{
    display:flex;align-items:center;gap:8px;
    margin-top:8px;padding-top:6px;border-top:1px solid var(--line)
  }
  .day-pbar{flex:1;height:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .day-pfill{height:100%;background:var(--ph-dim);transition:width .3s}
  .day-card.complete .day-pfill{background:var(--green)}
  .day-ptxt{font-size:17px;color:var(--ph-dim);min-width:52px;text-align:right;letter-spacing:1px}

  .home-foot{text-align:center;color:var(--ph-dim);font-size:16px;margin-top:22px;letter-spacing:1px}

  /* ══ DAY VIEW ══ */
  .view-day{display:none}
  .view-log{display:none}
  body.in-day .home{display:none}
  body.in-day .view-day{display:block}
  body.in-log .home{display:none}
  body.in-log .view-log{display:block}

  .console{
    position:sticky;top:0;z-index:20;background:var(--bg);
    margin:0 -12px;padding:8px 12px 10px;border-bottom:1px solid var(--line);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
  .back{font-size:19px;color:var(--ph-dim);text-transform:uppercase;letter-spacing:1px;padding:4px 2px;white-space:nowrap}
  .back:active{color:var(--ph)}
  .day-title{
    font-size:21px;text-transform:uppercase;letter-spacing:2px;
    color:var(--ph-bright);text-shadow:0 0 8px var(--ph);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;text-align:center;min-width:0;padding:0 6px;
  }
  .set-count{font-size:20px;color:var(--ph-dim);letter-spacing:1px}
  .set-count b{color:var(--green-b)}

  .scoreboard{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
  .sb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .clock-lbl{display:block;font-size:14px;color:var(--ph-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
  .clock{
    font-size:66px;line-height:.88;letter-spacing:3px;
    font-variant-numeric:tabular-nums;color:var(--ph-bright);
    text-shadow:0 0 12px var(--ph),0 0 24px rgba(237,179,10,.15);
  }
  .clock.warn{color:#FFDD44;text-shadow:0 0 12px #FFAA00}
  .clock.over{color:var(--red-b);text-shadow:0 0 12px var(--red)}
  .ctrl{display:flex;flex-direction:column;gap:6px}
  .btn{
    font-family:'VT323',monospace;font-size:20px;letter-spacing:2px;
    text-transform:uppercase;padding:8px 14px;
    background:var(--surface-2);border:1px solid var(--ph-dim);
    color:var(--ph);min-width:90px;text-align:center;cursor:pointer;
  }
  .btn:active{background:var(--ph-dim);color:var(--bg)}
  .btn.primary{border-color:var(--ph);background:rgba(200,149,15,.15)}
  .btn.primary:active{background:var(--ph);color:var(--bg)}
  .btn.ghost{color:var(--ph-dim);border-color:var(--line)}
  .bar-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px;color:var(--ph-dim)}
  .bar{flex:1;height:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;width:0%;background:var(--ph-dim);transition:width 1s linear}
  .bar.over > i{background:var(--red)}
  .bar-pct{min-width:38px;text-align:right}

  .rest-strip{
    display:flex;align-items:center;gap:6px;
    margin-top:8px;background:var(--surface);border:1px solid var(--line);padding:9px 10px;
  }
  .rest-lbl{display:block;font-size:14px;letter-spacing:3px;color:var(--ph-dim);text-transform:uppercase}
  .rclock{font-size:36px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ph-dim);letter-spacing:1px;min-width:60px}
  .rest-strip.active .rclock{color:var(--teal-b);text-shadow:0 0 8px var(--teal)}
  .presets{display:flex;gap:4px;margin-left:auto}
  .preset{
    font-family:'VT323',monospace;font-size:18px;
    padding:6px 7px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ph-dim);cursor:pointer;
  }
  .preset.sel{color:var(--teal-b);border-color:var(--teal-b)}
  .preset:active{background:var(--line)}
  .skip-btn{font-size:17px;color:var(--teal-b);padding:6px 4px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}

  /* ══ EXERCISE LIST ══ */
  .list{margin-top:12px;display:grid;gap:6px}

  @keyframes wiggle{
    0%,100%{transform:rotate(0deg) translateX(0)}
    20%{transform:rotate(-1.5deg) translateX(-1px)}
    55%{transform:rotate(1.5deg) translateX(1px)}
    80%{transform:rotate(-1deg) translateX(-1px)}
  }
  .list.editing-mode .ex{animation:wiggle .5s ease-in-out infinite;transform-origin:center}
  .list.editing-mode .ex:nth-child(2n){animation-delay:.07s;animation-direction:alternate}
  .list.editing-mode .ex:nth-child(3n){animation-delay:.14s}
  .list.editing-mode .ex:nth-child(4n){animation-delay:.04s;animation-direction:alternate-reverse}

  .ex{background:var(--surface);border:1px solid var(--line);overflow:hidden}
  .ex.done{border-color:var(--green)}
  .ex-top{display:flex;align-items:center;width:100%}
  .ex-head{
    flex:1;display:flex;align-items:center;gap:8px;
    padding:12px 14px;text-align:left;min-width:0;
    border:none;background:none;cursor:pointer;color:inherit;font-family:inherit;
  }
  .ex-num{font-size:17px;color:var(--ph-dim);min-width:26px;letter-spacing:0}
  .ex.done .ex-num{color:var(--green-b)}
  .ex-name{font-size:21px;text-transform:uppercase;letter-spacing:1px;flex:1;line-height:.95;min-width:0}
  .ex.done .ex-name{color:var(--green-b)}
  .opt-tag{font-size:13px;color:var(--ph-dim);border:1px solid var(--line);padding:0 5px;margin-left:5px;letter-spacing:1px}
  .ex-count{font-size:20px;color:var(--ph-dim);font-variant-numeric:tabular-nums}
  .ex.done .ex-count{color:var(--green-b)}
  .ex-chev{font-size:18px;color:var(--ph-dim);transition:transform .15s}
  .ex.open .ex-chev{transform:rotate(90deg)}

  .mini-btn{
    flex-shrink:0;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    margin-left:8px;line-height:1;cursor:pointer;font-size:18px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ph-dim);
  }
  .mini-btn:active{background:var(--line);color:var(--ph)}
  .minus-btn{
    flex-shrink:0;width:28px;height:28px;
    background:var(--red);color:#fff;font-size:22px;
    display:flex;align-items:center;justify-content:center;
    margin-left:10px;line-height:1;padding-bottom:1px;cursor:pointer;
  }
  .minus-btn:active{background:var(--red-b)}

  .ex-body{display:none;padding:0 14px 12px}
  .ex.open .ex-body{display:block}

  .set-row{
    display:flex;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px dashed var(--line);
  }
  .sr-lbl{font-size:15px;letter-spacing:1px;color:var(--ph-dim);min-width:44px;text-transform:uppercase}
  .set-row.done .sr-lbl{color:var(--green)}
  .sr-in{
    background:var(--bg);border:1px solid var(--line);color:var(--ph);
    font-family:'VT323',monospace;font-size:19px;padding:5px 4px;text-align:center;
    -webkit-appearance:none;border-radius:0;
  }
  .sr-in::placeholder{color:var(--ph-dim);opacity:.55}
  .sr-in:focus{outline:none;border-color:var(--ph-dim)}
  .sr-w{width:64px}
  .sr-r{width:48px}
  .sr-x{font-size:16px;color:var(--ph-dim)}
  .sr-chk{
    margin-left:auto;font-size:23px;line-height:1;color:var(--ph-dim);
    padding:6px 10px;border:1px solid var(--line);background:var(--surface-2);
  }
  .sr-chk:active{background:var(--line)}
  .set-row.done .sr-chk{color:var(--green-b);border-color:var(--green);background:rgba(42,107,26,.2)}

  /* notes */
  .note-wrap{margin-top:4px}
  .note-input{
    width:100%;background:var(--bg);border:none;border-top:1px solid var(--line);
    color:var(--ph-dim);font-family:'VT323',monospace;font-size:18px;
    padding:8px 10px;resize:none;line-height:1.4;-webkit-appearance:none;
  }
  .note-input::placeholder{color:var(--line)}
  .note-input:focus{outline:none;color:var(--ph)}

  .plus-btn{
    width:100%;padding:14px;background:transparent;
    border:1px dashed var(--ph-dim);color:var(--ph-dim);
    font-family:'VT323',monospace;font-size:20px;letter-spacing:3px;
    text-transform:uppercase;cursor:pointer;
  }
  .plus-btn:active{border-color:var(--ph);color:var(--ph)}

  .action-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:14px}
  .edit-btn{
    padding:14px 6px;background:transparent;border:1px solid var(--ph-dim);
    color:var(--ph-dim);font-family:'VT323',monospace;font-size:19px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  }
  .edit-btn.active{background:rgba(200,149,15,.12);color:var(--ph);border-color:var(--ph)}
  .edit-btn:active{opacity:.8}
  .finish-btn{
    padding:14px 6px;background:rgba(42,107,26,.15);border:1px solid var(--green);
    color:var(--green-b);font-family:'VT323',monospace;font-size:19px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  }
  .finish-btn:active{background:var(--green);color:#fff}
  .clear-btn{
    padding:14px 6px;background:transparent;border:1px solid var(--line);
    color:var(--ph-dim);font-family:'VT323',monospace;font-size:19px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  }
  .clear-btn:active{border-color:var(--red-b);color:var(--red-b)}

  .view-foot{text-align:center;color:var(--ph-dim);font-size:15px;margin-top:20px;letter-spacing:1px}

  /* ══ LOG VIEW ══ */
  .view-log{padding-top:8px}
  .log-list{display:grid;gap:6px;margin-top:4px}
  .log-entry{background:var(--surface);border:1px solid var(--line);padding:10px 12px;cursor:pointer}
  .log-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .log-date{font-size:17px;color:var(--ph-dim);letter-spacing:1px;min-width:64px}
  .log-name{flex:1;font-size:21px;text-transform:uppercase;letter-spacing:1px}
  .log-meta{font-size:17px;color:var(--ph-dim);letter-spacing:1px}
  .log-body{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .log-entry.open .log-body{display:block}
  .log-line{display:flex;gap:8px;font-size:17px;padding:2px 0}
  .log-ex{color:var(--ph-dim);text-transform:uppercase;min-width:0;flex-shrink:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-sets{color:var(--ph);flex:1;word-break:break-word}
  .log-empty{text-align:center;color:var(--ph-dim);font-size:18px;padding:30px 0;letter-spacing:2px}
  .log-clear{
    width:100%;margin-top:14px;padding:12px;background:transparent;
    border:1px solid var(--line);color:var(--ph-dim);
    font-size:18px;letter-spacing:2px;text-transform:uppercase;
  }
  .log-clear:active{border-color:var(--red-b);color:var(--red-b)}

  @media(prefers-reduced-motion:reduce){
    *,.list.editing-mode .ex{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<!-- HOME -->
<section class="home">
  <div class="brand">
    <span class="bc bc-tl"></span><span class="bc bc-tr"></span>
    <span class="bc bc-bl"></span><span class="bc bc-br"></span>
    <span class="brand-title">LIFT CONSOLE</span>
    <span class="brand-ver">// TRAINING LOG v3.0</span>
    <span class="brand-sub">ARNOLD SPLIT · 6 DAY CYCLE</span>
  </div>

  <div class="cycle">
    <span class="cy-lbl">CYCLE</span>
    <div class="cy-segs" id="cySegs"></div>
    <span class="cy-txt" id="cyTxt">0/6</span>
    <button class="cy-reset" id="cyReset">RESET</button>
  </div>

  <div class="sec-row">
    <p class="sec-lbl">Select session</p>
    <button class="log-link" id="logBtn">[LOG]</button>
  </div>
  <div class="days" id="days"></div>
  <p class="home-foot">// DATA SAVES TO DEVICE</p>
</section>

<!-- DAY VIEW -->
<section class="view-day">
  <div class="console">
    <div class="topbar">
      <button class="back" id="back">◄ SESSIONS</button>
      <span class="day-title" id="dayTitle"></span>
      <span class="set-count"><b id="setsDone">0</b>/<span id="setsTotal">0</span></span>
    </div>

    <div class="scoreboard">
      <div class="sb-row">
        <div>
          <span class="clock-lbl">// SESSION</span>
          <span class="clock" id="clock">60:00</span>
        </div>
        <div class="ctrl">
          <button class="btn primary" id="startBtn">START</button>
          <button class="btn ghost" id="resetBtn">RESET</button>
        </div>
      </div>
      <div class="bar-row">
        <div class="bar" id="bar"><i></i></div>
        <span class="bar-pct" id="barPct">0%</span>
      </div>
    </div>

    <div class="rest-strip" id="restWrap">
      <div>
        <span class="rest-lbl">// REST</span>
        <span class="rclock" id="restClock">1:30</span>
      </div>
      <div class="presets" id="presets">
        <button class="preset" data-sec="60">60</button>
        <button class="preset sel" data-sec="90">90</button>
        <button class="preset" data-sec="120">120</button>
        <button class="preset" data-sec="180">180</button>
      </div>
      <button class="skip-btn" id="skipRest">SKIP</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="action-row">
    <button class="edit-btn" id="editBtn">[E] EDIT</button>
    <button class="finish-btn" id="finishBtn">[✓] FINISH</button>
    <button class="clear-btn" id="clearBtn">CLEAR</button>
  </div>
  <p class="view-foot">// LOG WT × REPS PER SET · FINISH SAVES TO LOG</p>
</section>

<!-- LOG VIEW -->
<section class="view-log">
  <div class="topbar">
    <button class="back" id="logBack">◄ BACK</button>
    <span class="day-title">SESSION LOG</span>
    <span class="set-count" id="logCount"></span>
  </div>
  <div class="log-list" id="logList"></div>
  <button class="log-clear" id="logClear">CLEAR LOG</button>
</section>

<script>
(function(){
  "use strict";

  /* ── DATA ── */
  var TEMPLATES = {
    cb:{name:"CHEST + BACK",sub:"PUSH · PULL",ex:[
      {n:"Bench Press",s:4},
      {n:"Incline Press",s:3},
      {n:"Pec Dec",s:3},
      {n:"Lat Pulldown",s:3},
      {n:"Ab Crunch",s:3,opt:true},
      {n:"Seated Cable Low Row",s:3},
      {n:"Yellow Mid-Back Chest-Supported Row",s:3},
      {n:"SA Rear Delt Cable Fly",s:3},
      {n:"Cable Pull Through",s:2}
    ]},
    sa:{name:"SHOULDERS + ARMS",sub:"DELTS · BICEPS · TRICEPS",ex:[
      {n:"Overhead Press",s:4},
      {n:"Lateral Raise",s:3},
      {n:"Rear Delt Fly",s:3},
      {n:"Barbell Curl",s:3},
      {n:"Incline Curl",s:3},
      {n:"Tricep Pushdown",s:3},
      {n:"Skull Crushers",s:3},
      {n:"Hammer Curls / Rope Pushdowns",s:3}
    ]},
    l1:{name:"LOWER 1",sub:"POSTERIOR · GLUTES · HAMS",ex:[
      {n:"Smith Split Squat",s:3},
      {n:"SLDL",s:3},
      {n:"Hip Thrust",s:3},
      {n:"Hamstring Curl",s:3},
      {n:"Standing Calf Raise",s:3},
      {n:"Ab Crunch",s:3,opt:true}
    ]},
    l2:{name:"LOWER 2",sub:"QUADS · ACCESSORIES",ex:[
      {n:"Leg Press",s:3},
      {n:"Leg Extension",s:3},
      {n:"Seated Leg Curl",s:3},
      {n:"Abductors",s:3},
      {n:"Adductors",s:3},
      {n:"Calf Raises",s:3}
    ]}
  };
  var DAYS=[
    {id:"d1",t:"cb"},
    {id:"d2",t:"sa"},
    {id:"d3",t:"l1"},
    {id:"d4",t:"cb"},
    {id:"d5",t:"sa"},
    {id:"d6",t:"l2"}
  ];
  function dayDef(id){for(var i=0;i<DAYS.length;i++)if(DAYS[i].id===id)return DAYS[i];return null;}
  function tplOf(id){var d=dayDef(id);return d?d.t:null;}
  function nameOf(id){var d=dayDef(id);return d?TEMPLATES[d.t].name:"";}
  var SESSION=60*60;
  var MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  function fmtDate(t){var d=new Date(t);return MONTHS[d.getMonth()]+" "+d.getDate();}

  /* ── PERSISTENCE ── */
  var mem={};
  function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return(k in mem)?mem[k]:d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}
  function remove(k){try{localStorage.removeItem(k);}catch(e){delete mem[k];}}

  var progress  =load("lc3_progress",{});
  var setlog    =load("lc3_setlog",{});
  var notes     =load("lc3_notes",{});
  var customEx  =load("lc3_ex",{});
  var hist      =load("lc3_hist",[]);
  var cycleStart=load("lc3_cycle",0);
  var restPreset=load("lc3_rest",load("lc_rest",90));

  /* ── CUSTOM EXERCISES ── */
  function getEx(day){
    if(customEx[day]&&customEx[day].length>0)return customEx[day];
    return TEMPLATES[tplOf(day)].ex.map(function(e){return{n:e.n,s:e.s,opt:e.opt||false};});
  }
  function saveEx(day,arr){customEx[day]=arr;save("lc3_ex",customEx);}

  /* keep progress + setlog shape in sync with exercise list */
  function ensure(day){
    var list=getEx(day);
    if(!progress[day])progress[day]=[];
    if(!setlog[day])setlog[day]=[];
    var p=progress[day],w=setlog[day];
    while(p.length<list.length)p.push([]);
    p.length=list.length;
    while(w.length<list.length)w.push([]);
    w.length=list.length;
    list.forEach(function(e,i){
      if(!p[i])p[i]=[];
      while(p[i].length<e.s)p[i].push(false);
      p[i].length=e.s;
      if(!w[i])w[i]=[];
      while(w[i].length<e.s)w[i].push({w:"",r:""});
      w[i].length=e.s;
      for(var s=0;s<e.s;s++)if(!w[i][s])w[i][s]={w:"",r:""};
    });
    return p;
  }
  function saveAll(){save("lc3_progress",progress);save("lc3_setlog",setlog);}

  function getNote(day,i){return(notes[day]&&notes[day][i]!=null)?notes[day][i]:"";}
  function setNote(day,i,text){
    if(!notes[day])notes[day]={};
    if(text){notes[day][i]=text;}else{delete notes[day][i];}
    save("lc3_notes",notes);
  }

  /* previous session for a template: map exercise name -> logged sets */
  function prevFor(tpl){
    for(var i=0;i<hist.length;i++){
      if(hist[i].tpl===tpl){
        var m={};
        hist[i].ex.forEach(function(e){m[e.n]=e.sets;});
        return m;
      }
    }
    return null;
  }
  function lastEntry(dayId){
    for(var i=0;i<hist.length;i++)if(hist[i].day===dayId)return hist[i];
    return null;
  }
  function trainedThisCycle(dayId){
    var e=lastEntry(dayId);
    return !!(e&&e.t>=cycleStart);
  }

  /* ── TIMERS (deadline-based — survives iOS PWA background reload) ── */
  var sess={id:null,endAt:null,pausedRemaining:SESSION,running:false,buzzed:false};
  var rest={id:null,endAt:null,running:false};

  function sessRem(){if(sess.running&&sess.endAt)return Math.round((sess.endAt-Date.now())/1000);return sess.pausedRemaining;}
  function restRem(){if(rest.running&&rest.endAt)return Math.max(0,Math.round((rest.endAt-Date.now())/1000));return restPreset;}

  function fmt(sec){var neg=sec<0;sec=Math.abs(sec);var m=Math.floor(sec/60),s=sec%60;return(neg?"+":"")+m+":"+(s<10?"0":"")+s;}

  /* wake lock — keep screen on mid-session */
  var wl=null;
  function wlOn(){
    if(navigator.wakeLock&&!wl){
      navigator.wakeLock.request("screen").then(function(s){
        wl=s;s.addEventListener("release",function(){wl=null;});
      }).catch(function(){});
    }
  }
  function wlOff(){if(wl){try{wl.release();}catch(e){}wl=null;}}

  function tickSess(){renderSession();if(sessRem()<=0&&!sess.buzzed){sess.buzzed=true;buzz();}}
  function renderSession(){
    var rem=sessRem();
    var c=document.getElementById("clock"),b=document.getElementById("bar"),p=document.getElementById("barPct");
    c.textContent=fmt(rem);
    c.classList.toggle("over",rem<0);
    c.classList.toggle("warn",rem>=0&&rem<=300);
    var used=SESSION-rem, pct=Math.min(100,Math.max(0,(used/SESSION)*100));
    b.firstElementChild.style.width=pct+"%";
    b.classList.toggle("over",rem<0);
    if(p)p.textContent=Math.round(pct)+"%";
  }
  function startSession(){
    if(sess.running){
      sess.pausedRemaining=sessRem();
      clearInterval(sess.id);sess.id=null;sess.running=false;sess.endAt=null;
      saveSess();wlOff();
      document.getElementById("startBtn").textContent="RESUME";return;
    }
    sess.endAt=Date.now()+sess.pausedRemaining*1000;sess.running=true;saveSess();
    document.getElementById("startBtn").textContent="PAUSE";
    sess.id=setInterval(tickSess,500);wlOn();
  }
  function resetSession(){
    clearInterval(sess.id);sess.id=null;
    sess.running=false;sess.endAt=null;sess.pausedRemaining=SESSION;sess.buzzed=false;
    remove("lc3_sess");wlOff();
    document.getElementById("startBtn").textContent="START";renderSession();
  }
  function saveSess(){save("lc3_sess",{running:sess.running,endAt:sess.endAt,pausedRemaining:sess.pausedRemaining});}

  function tickRest(){
    renderRest();
    if(restRem()<=0){
      clearInterval(rest.id);rest.id=null;rest.running=false;rest.endAt=null;
      remove("lc3_rest_end");buzz();setTimeout(renderRest,900);
    }
  }
  function renderRest(){
    var rem=rest.running?restRem():restPreset;
    document.getElementById("restClock").textContent=fmt(rem);
    document.getElementById("restWrap").classList.toggle("active",rest.running);
  }
  function startRest(){
    clearInterval(rest.id);
    rest.endAt=Date.now()+restPreset*1000;rest.running=true;
    save("lc3_rest_end",rest.endAt);renderRest();
    rest.id=setInterval(tickRest,500);
  }
  function skipRest(){
    clearInterval(rest.id);rest.id=null;rest.running=false;rest.endAt=null;
    remove("lc3_rest_end");renderRest();
  }

  function buzz(){
    if(navigator.vibrate){try{navigator.vibrate([220,90,220]);}catch(e){}}
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
      var ac=new Ctx(),o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type="sine";o.frequency.value=880;
      g.gain.setValueAtTime(.001,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.02);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);
      o.start();o.stop(ac.currentTime+.5);
    }catch(e){}
  }

  /* ── HOME ── */
  function dayCounts(day){
    var list=getEx(day),st=ensure(day),done=0,total=0;
    list.forEach(function(e,i){var arr=st[i]||[];arr.forEach(function(b){total++;if(b)done++;});});
    return{done:done,total:total};
  }

  function renderCycle(){
    var segs=document.getElementById("cySegs");segs.innerHTML="";
    var n=0;
    DAYS.forEach(function(d){
      var on=trainedThisCycle(d.id);if(on)n++;
      var s=document.createElement("span");s.className="cy-seg"+(on?" on":"");
      segs.appendChild(s);
    });
    document.getElementById("cyTxt").textContent=n+"/"+DAYS.length;
  }

  function renderHome(){
    renderCycle();
    var wrap=document.getElementById("days");wrap.innerHTML="";
    DAYS.forEach(function(d,idx){
      var tpl=TEMPLATES[d.t],c=dayCounts(d.id);
      var trained=trainedThisCycle(d.id);
      var complete=trained||(c.done===c.total&&c.total>0);
      var pct=c.total>0?Math.round((c.done/c.total)*100):0;
      var last=lastEntry(d.id);

      var btn=document.createElement("button");
      btn.className="day-card"+(complete?" complete":"");

      var row=document.createElement("div");row.className="day-card-row";
      var num=document.createElement("span");num.className="day-num";num.textContent="0"+(idx+1);
      var info=document.createElement("div");info.className="day-info";
      var nm=document.createElement("span");nm.className="day-name";nm.textContent=tpl.name;
      var sub=document.createElement("span");sub.className="day-sub";
      sub.textContent=tpl.sub+" · "+c.total+" SETS"+(last?" · LAST "+fmtDate(last.t):"");
      info.appendChild(nm);info.appendChild(sub);
      var arr=document.createElement("span");arr.className="day-arr";arr.textContent=complete?"[OK]":"›";
      row.appendChild(num);row.appendChild(info);row.appendChild(arr);

      var pr=document.createElement("div");pr.className="day-prog-row";
      var pb=document.createElement("div");pb.className="day-pbar";
      var pf=document.createElement("div");pf.className="day-pfill";pf.style.width=(trained?100:pct)+"%";
      pb.appendChild(pf);
      var pt=document.createElement("span");pt.className="day-ptxt";pt.textContent=trained?"[✓]":c.done+"/"+c.total;
      pr.appendChild(pb);pr.appendChild(pt);

      btn.appendChild(row);btn.appendChild(pr);
      btn.addEventListener("click",function(){openDay(d.id);});
      wrap.appendChild(btn);
    });
  }

  function resetCycle(){
    if(!confirm("START NEW CYCLE? (LOG HISTORY IS KEPT)"))return;
    cycleStart=Date.now();save("lc3_cycle",cycleStart);
    renderHome();
  }

  /* ── DAY VIEW ── */
  var current=null,editing=false;

  function setCounts(){var c=dayCounts(current);document.getElementById("setsDone").textContent=c.done;document.getElementById("setsTotal").textContent=c.total;}

  function renderList(){
    var list=document.getElementById("list");list.innerHTML="";
    list.classList.toggle("editing-mode",editing);
    var st=ensure(current),wlog=setlog[current],defs=getEx(current);
    var prev=prevFor(tplOf(current));

    defs.forEach(function(e,i){
      var arr=st[i],wArr=wlog[i];
      var done=arr.filter(Boolean).length;
      var pv=prev?prev[e.n]:null;
      var ex=document.createElement("div");ex.className="ex"+(done===e.s?" done":"");

      var top=document.createElement("div");top.className="ex-top";

      if(editing){
        var mb=document.createElement("button");mb.className="minus-btn";mb.textContent="−";
        mb.setAttribute("aria-label","Remove "+e.n);
        (function(xi){mb.addEventListener("click",function(ev){ev.stopPropagation();removeEx(xi);});})(i);
        top.appendChild(mb);
        var up=document.createElement("button");up.className="mini-btn";up.textContent="▲";
        up.setAttribute("aria-label","Move "+e.n+" up");
        (function(xi){up.addEventListener("click",function(ev){ev.stopPropagation();moveEx(xi,-1);});})(i);
        top.appendChild(up);
        var dn=document.createElement("button");dn.className="mini-btn";dn.textContent="▼";
        dn.setAttribute("aria-label","Move "+e.n+" down");
        (function(xi){dn.addEventListener("click",function(ev){ev.stopPropagation();moveEx(xi,1);});})(i);
        top.appendChild(dn);
      }

      var head=document.createElement("button");head.className="ex-head";head.setAttribute("aria-expanded","false");
      var numSp=document.createElement("span");numSp.className="ex-num";numSp.textContent=(i+1<10?"0"+(i+1):""+(i+1));
      var nameSp=document.createElement("span");nameSp.className="ex-name";nameSp.textContent=e.n;
      if(e.opt){var ot=document.createElement("span");ot.className="opt-tag";ot.textContent="OPT";nameSp.appendChild(ot);}
      var countSp=document.createElement("span");countSp.className="ex-count";countSp.textContent=done+"/"+e.s;
      var chevSp=document.createElement("span");chevSp.className="ex-chev";chevSp.textContent="›";
      head.appendChild(numSp);head.appendChild(nameSp);head.appendChild(countSp);head.appendChild(chevSp);
      (function(xi){
        head.addEventListener("click",function(){
          if(editing){editEx(xi);return;}
          var open=ex.classList.toggle("open");
          head.setAttribute("aria-expanded",open?"true":"false");
        });
      })(i);
      top.appendChild(head);

      var body=document.createElement("div");body.className="ex-body";
      for(var s=0;s<e.s;s++){
        (function(si){
          var row=document.createElement("div");row.className="set-row"+(arr[si]?" done":"");
          var lbl=document.createElement("span");lbl.className="sr-lbl";lbl.textContent="SET "+(si+1);

          var wIn=document.createElement("input");
          wIn.className="sr-in sr-w";wIn.type="text";wIn.inputMode="decimal";wIn.maxLength=7;
          wIn.value=wArr[si].w;
          wIn.placeholder=(pv&&pv[si]&&pv[si].w)?pv[si].w:"WT";
          wIn.addEventListener("input",function(){wArr[si].w=wIn.value;save("lc3_setlog",setlog);});

          var x=document.createElement("span");x.className="sr-x";x.textContent="×";

          var rIn=document.createElement("input");
          rIn.className="sr-in sr-r";rIn.type="text";rIn.inputMode="numeric";rIn.maxLength=4;
          rIn.value=wArr[si].r;
          rIn.placeholder=(pv&&pv[si]&&pv[si].r)?pv[si].r:"RP";
          rIn.addEventListener("input",function(){wArr[si].r=rIn.value;save("lc3_setlog",setlog);});

          var chk=document.createElement("button");chk.className="sr-chk";
          chk.textContent=arr[si]?"[✓]":"[ ]";
          chk.setAttribute("aria-label","Set "+(si+1)+(arr[si]?" done":" not done"));
          chk.addEventListener("click",function(){
            arr[si]=!arr[si];save("lc3_progress",progress);
            row.classList.toggle("done",arr[si]);
            chk.textContent=arr[si]?"[✓]":"[ ]";
            var nd=arr.filter(Boolean).length;
            countSp.textContent=nd+"/"+e.s;
            ex.classList.toggle("done",nd===e.s);
            setCounts();if(arr[si])startRest();
          });

          row.appendChild(lbl);row.appendChild(wIn);row.appendChild(x);row.appendChild(rIn);row.appendChild(chk);
          body.appendChild(row);
        })(s);
      }

      (function(xi){
        var nw=document.createElement("div");nw.className="note-wrap";
        var ta=document.createElement("textarea");
        ta.className="note-input";ta.placeholder="// NOTES...";ta.rows=2;
        ta.value=getNote(current,xi);
        ta.addEventListener("input",function(){setNote(current,xi,ta.value);});
        nw.appendChild(ta);body.appendChild(nw);
      })(i);

      ex.appendChild(top);ex.appendChild(body);
      list.appendChild(ex);
    });

    if(editing){
      var pb=document.createElement("button");pb.className="plus-btn";pb.textContent="[+] ADD EXERCISE";
      pb.addEventListener("click",addEx);
      list.appendChild(pb);
    }
  }

  function swapNotes(a,b){
    if(!notes[current])return;
    var na=notes[current][a],nb=notes[current][b];
    if(nb==null)delete notes[current][a];else notes[current][a]=nb;
    if(na==null)delete notes[current][b];else notes[current][b]=na;
    save("lc3_notes",notes);
  }

  function moveEx(i,dir){
    var list=getEx(current).slice();
    var j=i+dir;
    if(j<0||j>=list.length)return;
    ensure(current);
    var t=list[i];list[i]=list[j];list[j]=t;
    saveEx(current,list);
    var p=progress[current];t=p[i];p[i]=p[j];p[j]=t;
    var w=setlog[current];t=w[i];w[i]=w[j];w[j]=t;
    saveAll();swapNotes(i,j);
    renderList();
  }

  function editEx(i){
    var list=getEx(current).slice();
    var e=list[i];
    var name=prompt("EXERCISE NAME:",e.n);
    if(name===null)return;
    if(name.trim())e.n=name.trim();
    var ss=prompt("NUMBER OF SETS:",""+e.s);
    if(ss!==null){
      var sets=parseInt(ss,10);
      if(!isNaN(sets)&&sets>=1&&sets<=10)e.s=sets;
    }
    list[i]=e;saveEx(current,list);
    ensure(current);saveAll();
    renderList();setCounts();
  }

  function removeEx(idx){
    var list=getEx(current).slice();
    if(!confirm("REMOVE "+list[idx].n.toUpperCase()+"?"))return;
    list.splice(idx,1);saveEx(current,list);
    if(progress[current])progress[current].splice(idx,1);
    if(setlog[current])setlog[current].splice(idx,1);
    saveAll();
    if(notes[current]){
      var nn={};
      Object.keys(notes[current]).forEach(function(k){
        var ki=parseInt(k,10);
        if(ki<idx)nn[k]=notes[current][k];
        else if(ki>idx)nn[String(ki-1)]=notes[current][k];
      });
      notes[current]=nn;save("lc3_notes",notes);
    }
    renderList();setCounts();
  }

  function addEx(){
    var name=prompt("EXERCISE NAME:");
    if(!name||!name.trim())return;
    var ss=prompt("NUMBER OF SETS:","3");
    var sets=parseInt(ss,10);if(isNaN(sets)||sets<1)sets=3;if(sets>10)sets=10;
    var list=getEx(current).slice();
    list.push({n:name.trim(),s:sets,opt:false});
    saveEx(current,list);
    ensure(current);saveAll();
    renderList();setCounts();
  }

  function toggleEdit(){
    editing=!editing;
    var btn=document.getElementById("editBtn");
    btn.textContent=editing?"[X] DONE":"[E] EDIT";
    btn.classList.toggle("active",editing);
    renderList();
  }

  function finishSession(){
    if(!current)return;
    var c=dayCounts(current);
    if(!confirm("LOG SESSION — "+nameOf(current)+" ("+c.done+"/"+c.total+" SETS)?"))return;
    ensure(current);
    var list=getEx(current),p=progress[current],w=setlog[current];
    var snap=list.map(function(e,i){
      return{n:e.n,sets:p[i].map(function(d,si){
        return{d:d?1:0,w:w[i][si].w||"",r:w[i][si].r||""};
      })};
    });
    var elapsed=Math.max(0,SESSION-sessRem());
    hist.unshift({
      t:Date.now(),day:current,tpl:tplOf(current),name:nameOf(current),
      dur:elapsed,done:c.done,total:c.total,ex:snap
    });
    if(hist.length>80)hist.length=80;
    save("lc3_hist",hist);
    delete progress[current];delete setlog[current];
    saveAll();
    resetSession();skipRest();goHome();
  }

  function openDay(day,keepTimers){
    current=day;editing=false;
    save("lc3_current",day);
    document.body.classList.add("in-day");
    document.getElementById("dayTitle").textContent=nameOf(day);
    document.getElementById("editBtn").textContent="[E] EDIT";
    document.getElementById("editBtn").classList.remove("active");
    if(!keepTimers){resetSession();skipRest();}
    renderList();setCounts();window.scrollTo(0,0);
  }

  function goHome(){
    editing=false;document.body.classList.remove("in-day");
    clearInterval(sess.id);sess.id=null;sess.running=false;
    clearInterval(rest.id);rest.id=null;rest.running=false;
    remove("lc3_current");remove("lc3_sess");remove("lc3_rest_end");
    wlOff();
    current=null;renderHome();
  }

  function clearDay(){
    if(!current)return;
    if(!confirm("CLEAR ALL SETS FOR "+nameOf(current)+"? (NOT LOGGED)"))return;
    delete progress[current];delete setlog[current];
    ensure(current);saveAll();
    resetSession();skipRest();renderList();setCounts();
  }

  /* ── LOG VIEW ── */
  function setStr(sets){
    var parts=[];
    sets.forEach(function(s){
      if(s.w)parts.push(s.w+"×"+(s.r||"?"));
      else if(s.d)parts.push("✓");
    });
    return parts.join("  ");
  }
  function renderLog(){
    var wrap=document.getElementById("logList");wrap.innerHTML="";
    document.getElementById("logCount").textContent=hist.length?hist.length+" LOGGED":"";
    document.getElementById("logClear").style.display=hist.length?"block":"none";
    if(!hist.length){
      var em=document.createElement("p");em.className="log-empty";em.textContent="// NO SESSIONS LOGGED YET";
      wrap.appendChild(em);return;
    }
    hist.forEach(function(h){
      var card=document.createElement("div");card.className="log-entry";

      var head=document.createElement("div");head.className="log-head";
      var dt=document.createElement("span");dt.className="log-date";dt.textContent=fmtDate(h.t);
      var nm=document.createElement("span");nm.className="log-name";nm.textContent=h.name;
      var meta=document.createElement("span");meta.className="log-meta";
      meta.textContent=h.done+"/"+h.total+" · "+fmt(h.dur);
      head.appendChild(dt);head.appendChild(nm);head.appendChild(meta);

      var body=document.createElement("div");body.className="log-body";
      var any=false;
      h.ex.forEach(function(e){
        var s=setStr(e.sets);
        if(!s)return;
        any=true;
        var line=document.createElement("div");line.className="log-line";
        var en=document.createElement("span");en.className="log-ex";en.textContent=e.n;
        var es=document.createElement("span");es.className="log-sets";es.textContent=s;
        line.appendChild(en);line.appendChild(es);
        body.appendChild(line);
      });
      if(!any){
        var no=document.createElement("div");no.className="log-line";
        var nt=document.createElement("span");nt.className="log-ex";nt.textContent="// NO SETS LOGGED";
        no.appendChild(nt);body.appendChild(no);
      }

      card.appendChild(head);card.appendChild(body);
      card.addEventListener("click",function(){card.classList.toggle("open");});
      wrap.appendChild(card);
    });
  }
  function goLog(){document.body.classList.add("in-log");renderLog();window.scrollTo(0,0);}
  function leaveLog(){document.body.classList.remove("in-log");renderHome();}
  function clearLog(){
    if(!confirm("DELETE ALL LOGGED SESSIONS?"))return;
    hist=[];save("lc3_hist",hist);renderLog();
  }

  /* ── WIRE UP ── */
  document.getElementById("startBtn").addEventListener("click",startSession);
  document.getElementById("resetBtn").addEventListener("click",resetSession);
  document.getElementById("back").addEventListener("click",goHome);
  document.getElementById("clearBtn").addEventListener("click",clearDay);
  document.getElementById("finishBtn").addEventListener("click",finishSession);
  document.getElementById("skipRest").addEventListener("click",skipRest);
  document.getElementById("editBtn").addEventListener("click",toggleEdit);
  document.getElementById("logBtn").addEventListener("click",goLog);
  document.getElementById("logBack").addEventListener("click",leaveLog);
  document.getElementById("logClear").addEventListener("click",clearLog);
  document.getElementById("cyReset").addEventListener("click",resetCycle);
  document.getElementById("presets").addEventListener("click",function(ev){
    var b=ev.target.closest(".preset");if(!b)return;
    restPreset=parseInt(b.dataset.sec,10);save("lc3_rest",restPreset);
    document.querySelectorAll(".preset").forEach(function(p){p.classList.toggle("sel",p===b);});
    if(!rest.running)renderRest();
  });

  /* ── RESTORE ON LOAD (iOS PWA reload after background) ── */
  var savedCurrent=load("lc3_current",null);
  var savedSess   =load("lc3_sess",null);
  var savedRestEnd=load("lc3_rest_end",null);

  document.querySelectorAll(".preset").forEach(function(p){
    p.classList.toggle("sel",parseInt(p.dataset.sec,10)===restPreset);
  });

  if(savedCurrent&&dayDef(savedCurrent)){
    openDay(savedCurrent,true);
    if(savedSess){
      if(savedSess.running&&savedSess.endAt){
        sess.endAt=savedSess.endAt;
        sess.pausedRemaining=Math.round((savedSess.endAt-Date.now())/1000);
        sess.buzzed=sess.pausedRemaining<=0;sess.running=true;
        document.getElementById("startBtn").textContent="PAUSE";
        sess.id=setInterval(tickSess,500);wlOn();
      } else if(savedSess.pausedRemaining!=null){
        sess.pausedRemaining=savedSess.pausedRemaining;
        if(savedSess.pausedRemaining<SESSION)document.getElementById("startBtn").textContent="RESUME";
      }
    }
    renderSession();
    if(savedRestEnd){
      var rl=Math.round((savedRestEnd-Date.now())/1000);
      if(rl>0){rest.endAt=savedRestEnd;rest.running=true;rest.id=setInterval(tickRest,500);}
      else remove("lc3_rest_end");
    }
    renderRest();
  } else {
    renderRest();renderHome();
  }

  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){
      renderSession();
      if(sess.running)wlOn();
      if(rest.running&&restRem()<=0){
        clearInterval(rest.id);rest.id=null;rest.running=false;rest.endAt=null;remove("lc3_rest_end");
      }
      renderRest();
    }
  });

})();
</script>
</body>
</html>
